[MAIN]
; Particle system switch.
; PC, PS2, XBOX, XBOX+III
; "XBOX+III" is a mix of Xbox VC and Xbox GTA3. It was created because R* Vienna didn't port the explosion effects from Xbox version of GTA 3.
Particle=PS2

; On Xbox, the molotov flame effect is not properly centered(it's shifted from the actual center of the fire source), this option fixes this issue.
bFixXboxMolotovBug=True

; On Xbox, R* Vienna removed the additional water effect for broken fire hydrants. This option restores it.
bRestoreXboxHydrantWaterSpray=True

; R* made it impossible for water droplets to appear on the screen in interiors, but they forgot that there's a water feature at "North Point Mall". This option fixes that.
bFixWaterDropsInInteriors=True

; On PS2/PC, the game always uses the "flame1" texture instead of "flame5", this option fixes this issue.
; However, because this bug has been present in the game for a long time during its development, this effect was never meant to be used with this texture.
bFixFlame5Bug=False

; Fixes dark spots on the ground after explosions or molotov. This feature can be seen on pre-release GTA 3 screenshots. It was accidentally broken at some point during development.
bDarkSpotsBugFix=True

; If enabled, this will hide vanilla waterdrops. This may be useful if you're using neoWaterdrops option from SkyGFX.
bDisableVanillaWaterDrop=False

; If enabled, this will hide vanilla blooddrops. This may be useful if you're using neoWaterdrops option from SkyGFX.
bDisableVanillaBloodDrop=False
